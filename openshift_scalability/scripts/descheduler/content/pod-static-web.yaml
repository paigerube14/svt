apiVersion: v1
kind: Pod
metadata:
  name: static-web
  namespace: test
  labels:
    role: myrole
spec:
  priorityClassName: system-node-critical
  containers:
    - name: web
      image: quay.io/openshifttest/nginx@sha256:3936fb3946790d711a68c58be93628e43cbca72439079e16d154b5db216b58da
      ports:
        - name: web
          containerPort: 80
          protocol: TCP